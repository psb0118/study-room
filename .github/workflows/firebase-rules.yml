name: Deploy Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - 'firebase/firestore.rules'
      - 'firebase.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'study-room-d0c89' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check GCP_SA_KEY secret
        id: credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::notice::GCP_SA_KEY secret is not set; skipping Firestore Rules deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        if: steps.credentials.outputs.enabled == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy Firestore rules
        if: steps.credentials.outputs.enabled == 'true'
        run: |
          npx --yes firebase-tools@15 deploy \
            --only firestore:rules \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
